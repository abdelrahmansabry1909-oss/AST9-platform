# Browser smoke tests (Playwright, Chromium) — Phase P1F-1.
# Public specs always run. Authenticated specs self-skip unless an isolated
# staging Supabase project and synthetic accounts are configured. Partial or
# production-targeted authenticated configuration fails closed.

name: Smoke Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify authenticated staging safety contract
        run: npm run test:unit
      - name: Run smoke tests
        env:
          # Staging target: URL/marker are repository variables; anon key and
          # account credentials are repository secrets. Never use production
          # accounts or the production Supabase project here.
          AST9_E2E_STAGING_SUPABASE_URL: ${{ vars.AST9_E2E_STAGING_SUPABASE_URL }}
          AST9_E2E_STAGING_SUPABASE_ANON_KEY: ${{ secrets.AST9_E2E_STAGING_SUPABASE_ANON_KEY }}
          AST9_E2E_IDENTITY_MARKER: ${{ vars.AST9_E2E_IDENTITY_MARKER }}
          AST9_E2E_ADMIN_EMAIL: ${{ secrets.AST9_E2E_ADMIN_EMAIL }}
          AST9_E2E_ADMIN_PASSWORD: ${{ secrets.AST9_E2E_ADMIN_PASSWORD }}
          AST9_E2E_COACH_EMAIL: ${{ secrets.AST9_E2E_COACH_EMAIL }}
          AST9_E2E_COACH_PASSWORD: ${{ secrets.AST9_E2E_COACH_PASSWORD }}
          AST9_E2E_CLIENT_EMAIL: ${{ secrets.AST9_E2E_CLIENT_EMAIL }}
          AST9_E2E_CLIENT_PASSWORD: ${{ secrets.AST9_E2E_CLIENT_PASSWORD }}
          AST9_E2E_INACTIVE_CLIENT_EMAIL: ${{ secrets.AST9_E2E_INACTIVE_CLIENT_EMAIL }}
          AST9_E2E_INACTIVE_CLIENT_PASSWORD: ${{ secrets.AST9_E2E_INACTIVE_CLIENT_PASSWORD }}
          AST9_E2E_UNASSIGNED_CLIENT_EMAIL: ${{ secrets.AST9_E2E_UNASSIGNED_CLIENT_EMAIL }}
          AST9_E2E_UNASSIGNED_CLIENT_PASSWORD: ${{ secrets.AST9_E2E_UNASSIGNED_CLIENT_PASSWORD }}
        run: npm run test:smoke
