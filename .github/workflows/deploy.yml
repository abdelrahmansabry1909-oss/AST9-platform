# Build the Vite static bundle and deploy it to GitHub Pages.
#
# Site URL: https://abdelrahmansabry1909-oss.github.io/AST9_HUB/
#
# One-time setup required on the repository:
#   Settings → Pages → "Build and deployment" → Source: GitHub Actions
#
# Once that's set, every push to `main` rebuilds and deploys. Manual
# runs are also possible via Actions → Deploy to GitHub Pages → Run
# workflow.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages only allows one concurrent deploy. Don't cancel in-flight runs
# — let the previous deploy finish so it doesn't ship a half-broken
# bundle.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:ci

      - name: Verify authenticated staging safety contract
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public smoke tests
        run: npm run test:smoke:public

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static bundle
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
